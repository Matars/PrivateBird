name: Build and release PrivateBird binary

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag to build'
        required: false
        default: 'main'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: macos-13
            suffix: macos-x64
          - os: macos-14
            suffix: macos-arm64
          - os: windows-latest
            suffix: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Build dist (TypeScript)
        run: pnpm run build:dist

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build standalone binary
        id: version
        shell: bash
        run: |
          BIRD_VERSION=$(node -p "require('./package.json').version")
          BIRD_GIT_SHA=$(git rev-parse --short=8 HEAD)
          export BIRD_VERSION BIRD_GIT_SHA
          bun build --compile --minify \
            --env="BIRD_*" \
            src/cli.ts \
            --outfile "bird-${BIRD_VERSION}-${{ matrix.suffix }}"
          echo "version=$BIRD_VERSION" >> $GITHUB_OUTPUT

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: privatebird-${{ matrix.suffix }}
          path: bird-*-${{ matrix.suffix }}*

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: privatebird-*
          path: binaries
          merge-multiple: true

      - name: List binaries
        run: ls -la binaries/

      - name: Get version
        id: version
        run: |
          FILE=$(ls binaries/bird-* 2>/dev/null | head -1)
          VERSION=$(echo "$FILE" | sed 's/.*bird-//' | sed 's/-linux-x64//' | sed 's/-macos-x64//' | sed 's/-macos-arm64//' | sed 's/-windows-x64//' | sed 's/\.exe$//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release in x-view (public)
        env:
          GH_TOKEN: ${{ secrets.XVIEW_RELEASE_PAT }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="bird-v${VERSION}"

          # Create or reuse the release
          gh release create "$TAG" \
            --repo Matars/x-view \
            --title "PrivateBird v${VERSION}" \
            --notes "Pre-built PrivateBird binary v${VERSION}" \
            binaries/bird-* 2>&1 || \
          gh release upload "$TAG" \
            --repo Matars/x-view \
            binaries/bird-* --clobber 2>&1
